<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AOP Builder workflow</title>
  <desc id="desc">Visual one-slide workflow from human setup through automated document processing to human review and final AOP graph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef7f8"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="autoBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dff7f5"/>
      <stop offset="0.55" stop-color="#e7f0ff"/>
      <stop offset="1" stop-color="#f2e8ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 54px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 23px; fill: #475569; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
      .step { font-family: Inter, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .mini { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 650; fill: #64748b; text-anchor: middle; }
      .tag { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 750; fill: #334155; }
      .number { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .icon { fill: none; stroke: #0f172a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #ffffff; stroke: #0f172a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .card { fill: #ffffff; stroke-width: 2.4; filter: url(#shadow); }
      .human { stroke: #f59e0b; }
      .auto { stroke: #06b6d4; }
      .ai { stroke: #8b5cf6; }
      .review { stroke: #ef4444; }
      .data { stroke: #22c55e; }
      .arrow { fill: none; stroke: #334155; stroke-width: 4; marker-end: url(#arrow); }
      .soft-arrow { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 9 9; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text class="title" x="80" y="86">AOP Builder workflow</text>
  <text class="subtitle" x="84" y="124">Human input guides the run; the app turns documents into a reviewed causal graph.</text>

  <rect x="80" y="165" width="1440" height="178" rx="34" fill="#fff7ed" opacity="0.86"/>
  <rect x="80" y="386" width="1440" height="222" rx="34" fill="url(#autoBand)" opacity="0.92"/>
  <rect x="80" y="650" width="1440" height="148" rx="34" fill="#fff1f2" opacity="0.86"/>

  <text class="label" x="112" y="205" fill="#b45309">Human setup</text>
  <text class="label" x="112" y="426" fill="#0e7490">App automation</text>
  <text class="label" x="112" y="690" fill="#be123c">Human review</text>

  <!-- Human setup cards -->
  <g transform="translate(190 238)">
    <rect class="card human" x="-92" y="-58" width="184" height="132" rx="24"/>
    <circle cx="-70" cy="-36" r="16" fill="#f59e0b"/><text class="number" x="-70" y="-35">1</text>
    <circle class="icon" cx="0" cy="-16" r="20"/>
    <path class="icon" d="M -38 42 C -28 14, 28 14, 38 42"/>
    <text class="step" x="0" y="105">Login</text>
  </g>

  <g transform="translate(515 238)">
    <rect class="card human" x="-104" y="-58" width="208" height="132" rx="24"/>
    <circle cx="-82" cy="-36" r="16" fill="#f59e0b"/><text class="number" x="-82" y="-35">2</text>
    <path class="icon-fill" d="M -38 42 L -38 -32 L 16 -32 L 42 -6 L 42 42 Z"/>
    <path class="icon" d="M 15 -32 L 15 -6 L 42 -6"/>
    <path class="icon" d="M -8 22 L -8 -8 M -23 7 L -8 -8 L 7 7"/>
    <text class="step" x="0" y="105">Upload PDFs</text>
  </g>

  <g transform="translate(850 238)">
    <rect class="card human" x="-104" y="-58" width="208" height="132" rx="24"/>
    <circle cx="-82" cy="-36" r="16" fill="#f59e0b"/><text class="number" x="-82" y="-35">3</text>
    <rect class="icon-fill" x="-42" y="-28" width="84" height="62" rx="10"/>
    <path class="icon" d="M -22 -8 L -6 8 L 26 -18"/>
    <text class="step" x="0" y="105">Select scope</text>
  </g>

  <g transform="translate(1220 238)">
    <rect x="-152" y="-50" width="304" height="118" rx="28" fill="#ffffff" stroke="#fdba74" stroke-width="2.2" filter="url(#shadow)"/>
    <path d="M -102 -4 C -80 -36, -34 -34, -20 -2 C -4 -26, 36 -22, 42 10 C 70 10, 88 27, 88 48 L -108 48 C -130 28, -124 10, -102 -4 Z" fill="#ffedd5" stroke="#f97316" stroke-width="4"/>
    <text class="step" x="20" y="8">Start run</text>
    <text class="mini" x="20" y="38">human decision point</text>
  </g>

  <line class="arrow" x1="290" y1="238" x2="398" y2="238"/>
  <line class="arrow" x1="623" y1="238" x2="732" y2="238"/>
  <line class="arrow" x1="958" y1="238" x2="1054" y2="238"/>
  <path class="soft-arrow" d="M 1220 306 C 1220 348, 256 348, 256 402"/>

  <!-- App automation pipeline -->
  <g transform="translate(245 498)">
    <rect class="card data" x="-96" y="-66" width="192" height="132" rx="24"/>
    <path class="icon" d="M -38 -18 C -38 -38, 38 -38, 38 -18 C 38 2, -38 2, -38 -18 Z"/>
    <path class="icon" d="M -38 -18 L -38 28 C -38 48, 38 48, 38 28 L 38 -18"/>
    <path class="icon" d="M -38 6 C -38 26, 38 26, 38 6"/>
    <text class="step" x="0" y="96">Store</text>
  </g>

  <g transform="translate(520 498)">
    <rect class="card auto" x="-96" y="-66" width="192" height="132" rx="24"/>
    <path class="icon-fill" d="M -36 42 L -36 -38 L 24 -38 L 46 -16 L 46 42 Z"/>
    <path class="icon" d="M 22 -38 L 22 -16 L 46 -16"/>
    <path class="icon" d="M -14 -8 L 24 -8 M -14 12 L 24 12"/>
    <text class="step" x="0" y="96">Extract text</text>
  </g>

  <g transform="translate(795 498)">
    <rect class="card auto" x="-96" y="-66" width="192" height="132" rx="24"/>
    <rect class="icon-fill" x="-42" y="-32" width="36" height="34" rx="6"/>
    <rect class="icon-fill" x="6" y="-32" width="36" height="34" rx="6"/>
    <rect class="icon-fill" x="-42" y="14" width="36" height="34" rx="6"/>
    <rect class="icon-fill" x="6" y="14" width="36" height="34" rx="6"/>
    <text class="step" x="0" y="96">Chunk</text>
  </g>

  <g transform="translate(1070 498)">
    <rect class="card ai" x="-96" y="-66" width="192" height="132" rx="24"/>
    <circle class="icon" cx="-18" cy="-8" r="26"/>
    <path class="icon" d="M 2 12 L 38 48"/>
    <path class="icon" d="M -30 -8 L -18 6 L 12 -24"/>
    <text class="step" x="0" y="96">Rank</text>
  </g>

  <g transform="translate(1345 498)">
    <rect class="card ai" x="-96" y="-66" width="192" height="132" rx="24"/>
    <circle class="icon-fill" cx="-34" cy="-8" r="16"/>
    <circle class="icon-fill" cx="34" cy="-30" r="16"/>
    <circle class="icon-fill" cx="30" cy="34" r="16"/>
    <path class="icon" d="M -18 -12 L 18 -26 M -18 0 L 15 28"/>
    <text class="step" x="0" y="96">Extract links</text>
  </g>

  <line class="arrow" x1="341" y1="498" x2="410" y2="498"/>
  <line class="arrow" x1="616" y1="498" x2="685" y2="498"/>
  <line class="arrow" x1="891" y1="498" x2="960" y2="498"/>
  <line class="arrow" x1="1166" y1="498" x2="1235" y2="498"/>

  <g transform="translate(800 589)">
    <rect x="-275" y="-23" width="550" height="46" rx="23" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="-232" cy="0" r="11" fill="#22c55e"/>
    <circle cx="-42" cy="0" r="11" fill="#06b6d4"/>
    <circle cx="144" cy="0" r="11" fill="#8b5cf6"/>
    <text class="tag" x="-208" y="6">RabbitMQ</text>
    <text class="tag" x="-18" y="6">API gateway</text>
    <text class="tag" x="168" y="6">databases</text>
  </g>

  <path class="soft-arrow" d="M 1345 565 C 1345 626, 324 626, 324 668"/>

  <!-- Review and output -->
  <g transform="translate(305 724)">
    <rect class="card human" x="-110" y="-50" width="220" height="108" rx="24"/>
    <path class="icon" d="M -38 -20 L -8 10 L 42 -36"/>
    <path class="icon" d="M -40 34 L 44 34"/>
    <text class="step" x="0" y="90">Review chunks</text>
  </g>

  <g transform="translate(690 724)">
    <rect class="card review" x="-110" y="-50" width="220" height="108" rx="24"/>
    <circle class="icon-fill" cx="-42" cy="-4" r="14"/>
    <circle class="icon-fill" cx="0" cy="-30" r="14"/>
    <circle class="icon-fill" cx="42" cy="12" r="14"/>
    <path class="icon" d="M -28 -12 L -12 -24 M 12 -20 L 30 2 M -28 4 L 28 10"/>
    <text class="step" x="0" y="90">Inspect graph</text>
  </g>

  <g transform="translate(1075 724)">
    <rect class="card data" x="-110" y="-50" width="220" height="108" rx="24"/>
    <path class="icon" d="M -40 0 C -22 -32, 22 -32, 40 0 C 22 32, -22 32, -40 0 Z"/>
    <circle class="icon-fill" cx="0" cy="0" r="12"/>
    <path class="icon" d="M 40 -28 L 52 -40 M 42 28 L 58 40"/>
    <text class="step" x="0" y="90">Enrich</text>
  </g>

  <g transform="translate(1400 724)">
    <rect x="-82" y="-58" width="164" height="124" rx="26" fill="#ffffff" stroke="#ef4444" stroke-width="2.8" filter="url(#shadow)"/>
    <circle cx="-28" cy="-12" r="13" fill="#ef4444"/>
    <circle cx="28" cy="-28" r="13" fill="#8b5cf6"/>
    <circle cx="24" cy="28" r="13" fill="#22c55e"/>
    <path d="M -16 -16 L 16 -26 M -18 -4 L 12 22" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <text class="step" x="0" y="96">AOP graph</text>
  </g>

  <line class="arrow" x1="415" y1="724" x2="568" y2="724"/>
  <line class="arrow" x1="800" y1="724" x2="953" y2="724"/>
  <line class="arrow" x1="1185" y1="724" x2="1298" y2="724"/>
</svg>
